<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>歴代天皇126</title>
<style>
:root {
  --bg:#f6f6f2;
  --card:#fff;
  --text:#202020;
  --sub:#737373;
  --line:#deded8;
  --accent:#7b1f28;
}
* { box-sizing:border-box; }
html,body {
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}
body {
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
header {
  flex:0 0 auto;
  padding:16px 18px 12px;
  border-bottom:1px solid var(--line);
  background:rgba(246,246,242,.96);
}
.header-inner { max-width:760px; margin:0 auto; }
h1 { margin:0; font-size:21px; letter-spacing:.04em; }
.subtitle { margin-top:2px; color:var(--sub); font-size:12px; }
.progress {
  margin-top:10px; height:5px; border-radius:999px;
  background:#ddd; overflow:hidden;
}
.progress > div {
  height:100%; width:0; background:var(--accent);
  transition:width .2s ease;
}
main {
  flex:1 1 auto;
  min-height:0;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  padding:22px 14px 24px;
}
.screen { max-width:760px; margin:0 auto; }
.card {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:26px 22px 28px;
  box-shadow:0 2px 12px rgba(0,0,0,.03);
}
.number { color:var(--accent); font-size:13px; font-weight:700; }
h2 { margin:4px 0 0; font-size:30px; letter-spacing:.05em; line-height:1.35; }
.kana { margin-top:3px; color:var(--sub); font-size:13px; }
.description {
  margin:22px 0 0;
  font-size:16px;
  line-height:1.95;
  text-align:justify;
}
nav {
  flex:0 0 auto;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.96);
  border-top:1px solid var(--line);
}
.nav-inner {
  max-width:760px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:10px;
  align-items:center;
}
.nav-btn {
  appearance:none;
  -webkit-appearance:none;
  border:1px solid #cfcfc9;
  background:#fff;
  color:var(--text);
  border-radius:13px;
  min-height:48px;
  padding:9px 14px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  touch-action:manipulation;
}
.nav-btn:active { transform:scale(.985); background:#f3f3ef; }
.nav-btn:disabled { opacity:.32; cursor:default; transform:none; }
#counter {
  min-width:78px;
  text-align:center;
  color:var(--sub);
  font-size:13px;
  user-select:none;
  -webkit-user-select:none;
}
@media (max-width:480px) {
  header { padding-left:14px; padding-right:14px; }
  main { padding:16px 10px 18px; }
  .card { padding:22px 18px 25px; border-radius:15px; }
  h2 { font-size:27px; }
  .description { font-size:15.5px; line-height:1.9; }
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>歴代天皇126</h1>
    <div class="subtitle">第1代 神武天皇〜第126代 今上天皇</div>
    <div class="progress"><div id="bar"></div></div>
  </div>
</header>

<main id="main">
  <div class="screen">
    <article class="card">
      <div class="number" id="number"></div>
      <h2 id="name"></h2>
      <div class="kana" id="kana"></div>
      <p class="description" id="description"></p>
    </article>
  </div>
</main>

<nav>
  <div class="nav-inner">
    <button class="nav-btn" id="prev" type="button">← 前へ</button>
    <div id="counter">1 / 126</div>
    <button class="nav-btn" id="next" type="button">次へ →</button>
  </div>
</nav>

<script>
const emperors = [{"number": "第1代", "name": "神武天皇", "kana": "じんむてんのう", "desc": "日本の夜明けを告げた初代天皇。天照大御神の血を引き、日向の地から大和を目指す東征という過酷な旅に出ました。数々の苦難を乗り越え、金鵄や八咫烏の導きによって橿原の地で即位。ここから日本の歴史が始まりました。単なる伝説ではなく、国家の礎を築いた不屈の精神を持つ指導者として今も語り継がれています。"}, {"number": "第2代", "name": "綏靖天皇", "kana": "すいぜいてんのう", "desc": "初代の意志を継いだ2代目天皇。神武天皇の崩御後、異母兄による皇位簒奪の陰謀という絶体絶命の危機に直面しました。しかし勇気を持ってこの反乱を鎮め、大和を再び一つにまとめました。動乱期における秩序の守護者として、皇位継承の形を固める重要な一歩を築いたと語られています。"}, {"number": "第3代", "name": "安寧天皇", "kana": "あんねいてんのう", "desc": "国家の安定を盤石にした3代目天皇。その名の通り、安らかで安寧な世の中を求めたとされます。戦乱の火種を消し、人々の暮らしに平穏をもたらすことに心を砕いた治世。記録の少ない時代ですが、初期の激動を乗り越え、日本という国が熟成していく土台を静かに築いた存在として語られます。"}, {"number": "第4代", "name": "懿徳天皇", "kana": "いとくてんのう", "desc": "美徳を体現した4代目天皇。力による支配ではなく、徳によって民を導く政治を目指したとされます。欠史八代の一人で記録は乏しいものの、一族の絆を重んじ、武力ではなく心のつながりで国を治めるという姿勢が、後の天皇たちに受け継がれる精神的な支柱になったと語られています。"}, {"number": "第5代", "name": "孝昭天皇", "kana": "こうしょうてんのう", "desc": "伝統を受け継いだ5代目天皇。先代たちが築いた平和を守り、次の世代へとつなぐ役割を果たしたとされます。先祖への感謝を政治の根幹に据えたと語られ、この時代には大和の勢力が少しずつ広がり、周辺の豪族たちとの結びつきも深まっていったとされます。"}, {"number": "第6代", "name": "孝安天皇", "kana": "こうあんてんのう", "desc": "長きにわたり国を治めた6代目天皇。100歳を超える長寿であったと伝えられ、国の安らぎを象徴する存在として語られます。治世では大きな争いが少なく、農業や民の生活が向上したとされました。急激な成長ではなく、確実な安定を選んだ時代として描かれています。"}, {"number": "第7代", "name": "孝霊天皇", "kana": "こうれいてんのう", "desc": "地方への影響力を強めた7代目天皇。この時代、大和の勢力は吉備など遠方へも広がり始めたと語られます。多くの皇子を各地へ派遣し、地域との結びつきを築こうとしたとされます。桃太郎伝説のモデルともいわれる吉備津彦命も皇子の一人とされ、伝説と歴史が交差する時代を象徴します。"}, {"number": "第8代", "name": "孝元天皇", "kana": "こうげんてんのう", "desc": "動乱の予兆の中で伝統を支えた8代目天皇。大和盆地を中心とした支配体制を整え、皇室の正統性を強めたと語られます。周辺勢力の動きが活発になる中で均衡を保ち、次の時代の飛躍に向けて力を蓄えた時期として描かれています。"}, {"number": "第9代", "name": "開化天皇", "kana": "かいかてんのう", "desc": "新たな文明の幕開けを象徴する9代目天皇。大陸からの影響や技術が少しずつ入り、文化が開けていった時代とされます。欠史八代の最後にあたり、神話の時代から次の英雄的な時代へと橋渡しをした存在として語られています。"}, {"number": "第10代", "name": "崇神天皇", "kana": "すじんてんのう", "desc": "実質的な国家創成者とも称される10代目天皇。国を襲った疫病に対し、神々を祀ることで立ち向かったとされます。また、全国に調税や戸籍につながる仕組みを整えたと語られ、古代国家の統治体制を大きく前進させた人物として描かれています。"}, {"number": "第11代", "name": "垂仁天皇", "kana": "すいにんてんのう", "desc": "慈愛と知恵で国を治めた11代目天皇。殉死という残酷な風習を改め、土人形である埴輪を身代わりに置くようになったという伝承で知られます。また、野見宿禰と当麻蹴速の力比べは日本最古の相撲の伝承として有名です。不老不死の果実を求めて家臣を派遣した逸話も残ります。"}, {"number": "第12代", "name": "景行天皇", "kana": "けいこうてんのう", "desc": "巨大な行動力と情熱を備えた12代目天皇。自ら九州へ遠征して反抗勢力を鎮めるなど、大和朝廷の影響力を広げた拡大期の指導者として語られます。日本武尊の父としても知られ、親子で日本の東西を駆け巡った伝承は今も広く知られています。"}, {"number": "第13代", "name": "成務天皇", "kana": "せいむてんのう", "desc": "国家を組織化した13代目天皇。先代が広げた領域に区分を設け、地方官を配置したと伝えられます。武力による征服から、仕組みやルールによる管理へと移る時代を象徴する存在として描かれ、中央と地方を結ぶ統治体制の整備に力を注いだとされています。"}, {"number": "第14代", "name": "仲哀天皇", "kana": "ちゅうあいてんのう", "desc": "神意と現実の狭間で苦悩した14代目天皇。熊襲征討のため九州へ赴き、そこで神から海の向こうの新羅を目指すよう告げられたという伝承が残ります。志半ばで命を落とし、その意志は妻の神功皇后に引き継がれ、朝鮮半島をめぐる壮大な物語へとつながっていきます。"}, {"number": "第15代", "name": "応神天皇", "kana": "おうじんてんのう", "desc": "文明開化の波を導いた15代目天皇。大陸から多くの渡来人を受け入れ、土木技術や漢字などの文化を積極的に取り入れたとされます。後に戦いの神・八幡神として祀られますが、その時代は外来文化を柔軟に受け入れ、日本の力を大きく高めた時期として語られています。"}, {"number": "第16代", "name": "仁徳天皇", "kana": "にんとくてんのう", "desc": "慈愛のリーダーシップを体現した16代目天皇。民家から炊煙が上がっていないのを見て民の困窮を知り、宮殿の修理をやめて3年間税を免除したという逸話で知られます。「民の富こそが自分の富」と考えた理想の君主像として、現在まで広く語り継がれています。"}, {"number": "第17代", "name": "履中天皇", "kana": "りちゅうてんのう", "desc": "記録の重要性を重んじた17代目天皇。即位直後に弟の反乱に遭い、火を放たれた宮殿から脱出するという危機を経験したとされます。その後体制を立て直し、地方に国史を置いて記録を管理させるなど、情報を集約し秩序を再構築しようとした人物として描かれています。"}, {"number": "第18代", "name": "反正天皇", "kana": "はんぜいてんのう", "desc": "容姿端麗で平和を愛した18代目天皇。生まれた時から整った美しい歯を持っていたと伝えられ、穏やかな人柄で知られます。先代までに築かれた繁栄を維持し、大きな軍事行動を控えて内政の充実に努めた、安定の時代を象徴する天皇として語られています。"}, {"number": "第19代", "name": "允恭天皇", "kana": "いんぎょうてんのう", "desc": "氏姓の乱れを正そうとした19代目天皇。有力豪族が身分を偽る状況に対し、盟神探湯という神判を用いて氏姓を正したと伝えられます。病弱でありながら秩序の回復を進め、豪族社会の統制を強めた天皇として語られています。"}, {"number": "第20代", "name": "安康天皇", "kana": "あんこうてんのう", "desc": "皇位をめぐる激しい争いの中で即位した20代目天皇。反対勢力を排除して権力を固めようとしましたが、その強引さが新たな怨恨を生み、最後は復讐によって暗殺されたと伝えられます。皇位継承の難しさを象徴する悲劇的な治世でした。"}, {"number": "第21代", "name": "雄略天皇", "kana": "ゆうりゃくてんのう", "desc": "ワカタケル大王の名で知られる21代目天皇。鉄剣銘などから広い地域に強い影響力を持っていたことが知られます。強大な権力で豪族をまとめ、中央集権化を進めた一方、苛烈な性格の伝承も多く、光と影の大きい天皇です。"}, {"number": "第22代", "name": "清寧天皇", "kana": "せいねいてんのう", "desc": "生まれながらに白髪だったと伝えられる22代目天皇。自らに子がなかったため、途絶えかけた皇統を守るため各地から後継者を探し出しました。後に即位する顕宗・仁賢の両天皇へ皇統をつないだ、静かな守護者として描かれます。"}, {"number": "第23代", "name": "顕宗天皇", "kana": "けんぞうてんのう", "desc": "幼い頃に一族の争いから逃れ、身分を隠して暮らしたと伝えられる23代目天皇。苦しい生活を経験した後に皇族として迎え戻され即位しました。民の苦しみを知る天皇として、弱い立場の人々に心を寄せた治世が語られています。"}, {"number": "第24代", "name": "仁賢天皇", "kana": "にんけんてんのう", "desc": "弟の顕宗天皇と皇位を譲り合ったと伝えられる24代目天皇。即位後は大きな争いが少なく、穏やかな治世を築いたとされます。武力より徳を重んじ、人々が安心して暮らせる社会を目指した平和な時代の天皇です。"}, {"number": "第25代", "name": "武烈天皇", "kana": "ぶれつてんのう", "desc": "『日本書紀』で残虐な行為を重ねた暴君として描かれる25代目天皇。ただし後世の王朝交代を正当化するための脚色ではないかという見方もあります。仁徳天皇から続く直系がこの代で途絶え、次の継体天皇へ大きな転換を迎えました。"}, {"number": "第26代", "name": "継体天皇", "kana": "けいたいてんのう", "desc": "皇統断絶の危機に、遠い皇族の血筋から迎えられた26代目天皇。即位後すぐに大和へ入れず、長い時間をかけて各地の豪族との関係を整えました。筑紫の磐井の乱を鎮めるなど国家の再統合を進め、新しい時代の基盤を築きました。"}, {"number": "第27代", "name": "安閑天皇", "kana": "あんかんてんのう", "desc": "継体天皇の後を継いだ27代目天皇。全国各地に屯倉を設け、朝廷の直轄地や米の備蓄を広げたと伝えられます。軍事的な拡大よりも経済基盤と食料管理を重視し、国家の安定を支えた実務型の天皇です。"}, {"number": "第28代", "name": "宣化天皇", "kana": "せんかてんのう", "desc": "飢饉への対応など危機管理に力を発揮した28代目天皇。各地の米を集めて備蓄し、食料を安定させることを重視したと伝えられます。短い治世ながら、豪族の力を活用して国家の安定を保った行動力のある天皇です。"}, {"number": "第29代", "name": "欽明天皇", "kana": "きんめいてんのう", "desc": "仏教伝来という大きな転換点を迎えた29代目天皇。百済から仏像や経典がもたらされ、仏教受容をめぐって蘇我氏と物部氏の対立が深まりました。大陸文化を取り入れながら、日本の宗教と政治のあり方が大きく変化し始めた時代です。"}, {"number": "第30代", "name": "敏達天皇", "kana": "びだつてんのう", "desc": "仏教受容をめぐる対立が激しくなった30代目天皇。蘇我氏と物部氏が争う中、伝統的な神々を重んじる立場を取りました。一方で渡来人の技術や知識は活用し、外来文化をどこまで受け入れるかという難しい舵取りを担いました。"}, {"number": "第31代", "name": "用明天皇", "kana": "ようめいてんのう", "desc": "聖徳太子の父として知られる31代目天皇。皇室の中で仏教への信仰を強く示し、蘇我氏と物部氏の対立が続く中で仏法に救いを求めました。治世は短く、神と仏が共存する新しい時代への橋渡しをした天皇として描かれます。"}, {"number": "第32代", "name": "崇峻天皇", "kana": "すしゅんてんのう", "desc": "蘇我馬子によって擁立された32代目天皇。強大な蘇我氏に反発し、その排除を望んだことが伝わると、最終的に暗殺されました。天皇が臣下によって殺害されるという異例の事件で、豪族政治の緊張が頂点に達した時代です。"}, {"number": "第33代", "name": "推古天皇", "kana": "すいこてんのう", "desc": "日本初の女性天皇とされる33代目天皇。聖徳太子を摂政とし、蘇我馬子と協調しながら政治を進めました。冠位十二階、十七条憲法、遣隋使などを通じ、飛鳥時代の国家体制と外交の基礎を整えた重要な天皇です。"}, {"number": "第34代", "name": "舒明天皇", "kana": "じょめいてんのう", "desc": "唐との交流を本格化させた34代目天皇。遣唐使を派遣し、先進的な制度や仏教文化を学ぼうとしました。一方で蘇我氏の力はさらに強まり、皇室と豪族の緊張が高まっていきます。後の大化の改新へつながる前夜の天皇です。"}, {"number": "第35代", "name": "皇極天皇", "kana": "こうぎょくてんのう", "desc": "蘇我入鹿が宮中で暗殺された乙巳の変を目の前で経験した35代目天皇。事件後に退位し、日本史上初の生前退位とされます。後に斉明天皇として再び即位する、波乱に満ちた生涯を送った女性天皇です。"}, {"number": "第36代", "name": "孝徳天皇", "kana": "こうとくてんのう", "desc": "乙巳の変後に即位し、元号「大化」を掲げた36代目天皇。大化の改新を進め、豪族中心の政治から天皇中心の国家へ転換しようとしました。難波への遷都や公地公民など、律令国家への道を切り開いた改革期の天皇です。"}, {"number": "第37代", "name": "斉明天皇", "kana": "さいめいてんのう", "desc": "皇極天皇が再び即位した37代目天皇。高齢ながら活発に政務を行い、蝦夷への遠征や百済救援を進めました。自ら九州まで赴き、その地で崩御。彼女の死後、日本は白村江の戦いという大きな国際戦争へ向かいます。"}, {"number": "第38代", "name": "天智天皇", "kana": "てんじてんのう", "desc": "中大兄皇子として大化の改新を主導した38代目天皇。白村江の戦いで唐・新羅連合軍に敗れた後、水城や山城を築いて防衛を強化しました。近江大津宮へ遷都し、国家制度の整備を進めた危機対応型の天皇です。"}, {"number": "第39代", "name": "弘文天皇", "kana": "こうぶんてんのう", "desc": "天智天皇の子・大友皇子とされる39代目天皇。父の死後、叔父の大海人皇子との間で壬申の乱が起こり、敗北して短い生涯を終えました。長く正式な天皇として扱われなかった、政争に翻弄された悲劇の天皇です。"}, {"number": "第40代", "name": "天武天皇", "kana": "てんむてんのう", "desc": "壬申の乱に勝利して即位した40代目天皇。強い皇権を築き、律令国家の形成を進めました。国号「日本」や天皇号の確立につながる動き、さらに『古事記』『日本書紀』編纂の準備など、国家の枠組みを大きく整えた天皇です。"}, {"number": "第41代", "name": "持統天皇", "kana": "じとうてんのう", "desc": "天武天皇の志を継いだ41代目の女性天皇。藤原京の造営を進め、律令国家の基礎を固めました。息子・草壁皇子の死を乗り越え、孫の文武天皇へ皇位をつなぐために強い政治力を発揮した天皇として知られます。"}, {"number": "第42代", "name": "文武天皇", "kana": "もんむてんのう", "desc": "持統天皇の孫として若くして即位した42代目天皇。治世の大きな成果は大宝律令の完成で、日本を法によって統治する律令国家へ大きく前進させました。若くして崩御しましたが、制度国家の形を整えた重要な天皇です。"}, {"number": "第43代", "name": "元明天皇", "kana": "げんめいてんのう", "desc": "平城京への遷都を行った43代目の女性天皇。『古事記』の完成や和同開珎の発行など、奈良時代の国家と文化の土台を築きました。新しい都と貨幣、歴史書を通じ、日本の国家としての姿を明確にした天皇です。"}, {"number": "第44代", "name": "元正天皇", "kana": "げんしょうてんのう", "desc": "元明天皇の後を継いだ44代目の女性天皇。『日本書紀』の完成や三世一身法など、律令国家の運営と土地制度の課題に取り組みました。母から受け継いだ奈良の国家体制をさらに整え、聖武天皇へつないだ天皇です。"}, {"number": "第45代", "name": "聖武天皇", "kana": "しょうむてんのう", "desc": "疫病や政情不安の中、仏教の力で国を救おうとした45代目天皇。東大寺の大仏建立を進め、国分寺・国分尼寺を整備しました。大きな負担も伴いましたが、天平文化を象徴する壮大な国家事業を推進した天皇です。"}, {"number": "第46代", "name": "孝謙天皇", "kana": "こうけんてんのう", "desc": "聖武天皇の娘として即位した46代目の女性天皇。藤原仲麻呂らをめぐる権力争いの中で退位した後、再び称徳天皇として即位します。一人の女性天皇として、奈良時代の激しい政治闘争の中心に立った人物です。"}, {"number": "第47代", "name": "淳仁天皇", "kana": "じゅんにんてんのう", "desc": "藤原仲麻呂の支援を受けて即位した47代目天皇。実権は孝謙上皇側にあり、仲麻呂の乱が敗れると廃位され、淡路へ流されました。長く歴代天皇から外されていたこともあり、権力争いに翻弄された悲劇の天皇です。"}, {"number": "第48代", "name": "称徳天皇", "kana": "しょうとくてんのう", "desc": "退位した孝謙天皇が重祚した48代目の女性天皇。僧・道鏡を重用し、宇佐八幡神託事件では皇位継承をめぐる大問題が起こりました。奈良時代後半の政治と宗教の緊張を象徴する最後の女性天皇です。"}, {"number": "第49代", "name": "光仁天皇", "kana": "こうにんてんのう", "desc": "称徳天皇の崩御後、62歳で即位した49代目天皇。天武系の皇統から天智系へと流れを戻し、乱れた政治や財政の立て直しを進めました。次の桓武天皇による平安京遷都へつながる、転換期の天皇です。"}, {"number": "第50代", "name": "桓武天皇", "kana": "かんむてんのう", "desc": "長岡京、そして平安京へ遷都した50代目天皇。奈良仏教勢力から距離を置き、新しい政治体制を築こうとしました。坂上田村麻呂を征夷大将軍に任じて東北経営を進めるなど、平安時代の基礎を作った強力な天皇です。"}, {"number": "第51代", "name": "平城天皇", "kana": "へいぜいてんのう", "desc": "桓武天皇の長男として即位した51代目天皇。退位後、藤原薬子らとともに平城京への再遷都を図りましたが、嵯峨天皇側に敗れました。薬子の変を通じ、上皇と現役天皇の権力関係が問われた時代の天皇です。"}, {"number": "第52代", "name": "嵯峨天皇", "kana": "さがてんのう", "desc": "薬子の変を鎮め、政治の安定を取り戻した52代目天皇。検非違使を設ける一方、空海を重用し、自らも三筆の一人に数えられる文化人でした。多くの皇子を臣籍降下させたことが源氏の始まりにつながったともされます。"}, {"number": "第53代", "name": "淳和天皇", "kana": "じゅんなてんのう", "desc": "嵯峨天皇の後を継いだ53代目天皇。倹約を重んじ、皇位継承争いを避けるため一族の調和を優先したとされます。大きな争いの少ない時期に、派手さより安定を選び、初期平安時代の穏やかな繁栄を支えました。"}, {"number": "第54代", "name": "仁明天皇", "kana": "にんみょうてんのう", "desc": "文化を愛した54代目天皇。その治世では承和の変が起こり、伴健岑や橘逸勢らが排除され、藤原良房の勢力が強まりました。穏やかな宮廷文化の裏で、藤原氏が実権を握るきっかけが生まれた転換期の天皇です。"}, {"number": "第55代", "name": "文徳天皇", "kana": "もんとくてんのう", "desc": "藤原良房の影響力が強まる中で即位した55代目天皇。自らの意向よりも外戚政治の力が大きくなり、幼い清和天皇への継承が進められました。天皇の政治的自由が弱まり、摂関政治が本格化する直前の天皇です。"}, {"number": "第56代", "name": "清和天皇", "kana": "せいわてんのう", "desc": "わずか9歳で即位した56代目天皇。藤原良房が摂政となり、摂関政治が本格的に始まりました。退位後は仏道に傾倒し、各地を巡礼したとされます。子孫から清和源氏が生まれ、後の武家社会へ大きな影響を残しました。"}, {"number": "第57代", "name": "陽成天皇", "kana": "ようぜいてんのう", "desc": "若くして即位し、17歳で退位させられた57代目天皇。正史には乱行の記録がありますが、藤原基経との政治的対立が背景にあったとも見られます。摂関家の力が天皇の地位を左右する時代を象徴する存在です。"}, {"number": "第58代", "name": "光孝天皇", "kana": "こうこうてんのう", "desc": "陽成天皇の退位後、55歳で即位した58代目天皇。自らを臨時の天皇と考え、皇子たちを臣籍降下させるなど藤原氏に配慮しました。質素で謙虚な人柄が語られ、途絶えかけた皇統を次代へつないだ天皇です。"}, {"number": "第59代", "name": "宇多天皇", "kana": "うだてんのう", "desc": "一度臣籍に下った後、皇族へ復帰して即位した59代目天皇。藤原基経の死後、菅原道真を重用し、寛平の治と呼ばれる親政を目指しました。摂関政治に対抗し、天皇自ら政治を行おうとした意欲的な天皇です。"}, {"number": "第60代", "name": "醍醐天皇", "kana": "だいごてんのう", "desc": "宇多天皇の志を受け継ぎ、延喜の治と呼ばれる親政を行った60代目天皇。菅原道真の大宰府左遷という悲劇も起こりましたが、文化面では『古今和歌集』が編纂されました。律令政治最後の理想的な治世として語られます。"}, {"number": "第61代", "name": "朱雀天皇", "kana": "すざくてんのう", "desc": "平将門の乱と藤原純友の乱、いわゆる承平天慶の乱に直面した61代目天皇。朝廷は武士の力を借りて反乱を鎮圧しました。この出来事を通じ、地方の武士が歴史の表舞台へ現れ始める転換期を迎えます。"}, {"number": "第62代", "name": "村上天皇", "kana": "むらかみてんのう", "desc": "天暦の治と呼ばれる親政を行った62代目天皇。摂政・関白を置かず、自ら政務にあたり、文化面では『後撰和歌集』の編纂を命じました。平安時代における天皇親政の最後の輝きとされる時代を築きました。"}, {"number": "第63代", "name": "冷泉天皇", "kana": "れいぜいてんのう", "desc": "幼少期から精神的な不安定さを伝えられる63代目天皇。即位後、藤原氏の影響がさらに強まり、安和の変で他の有力勢力が排除されました。天皇が政治の中心から離れ、外戚政治が支配的になる過程を象徴します。"}, {"number": "第64代", "name": "円融天皇", "kana": "えんゆうてんのう", "desc": "藤原氏内部の権力争いに翻弄された64代目天皇。誰が娘を入内させて外戚の地位を得るかという競争の中で、天皇自身も政治の大きな駒として扱われました。摂関政治が宮廷生活の隅々まで入り込んだ時代です。"}, {"number": "第65代", "name": "花山天皇", "kana": "かざんてんのう", "desc": "若くして即位し、藤原兼家の策略によって出家・退位へ追い込まれた65代目天皇。この事件は寛和の変として知られます。退位後は西国三十三所観音霊場の再興に関わったと伝えられ、政治から宗教へ生き方を変えました。"}, {"number": "第66代", "name": "一条天皇", "kana": "いちじょうてんのう", "desc": "平安文化の黄金期を象徴する66代目天皇。宮廷では『源氏物語』や『枕草子』が生まれ、藤原道長の時代と重なります。華やかな文化の一方で、一帝二后という異例の状況に置かれ、政治と私生活の狭間で苦悩しました。"}, {"number": "第67代", "name": "三条天皇", "kana": "さんじょうてんのう", "desc": "藤原道長と激しく対立した67代目天皇。眼病を抱えながらも道長の圧力に抵抗しましたが、最終的に退位へ追い込まれました。摂関政治が絶頂に達する中、天皇の自立を守ろうとした孤独な抵抗者として描かれます。"}, {"number": "第68代", "name": "後一条天皇", "kana": "ごいちじょうてんのう", "desc": "わずか9歳で即位した68代目天皇。藤原道長の孫であり、その治世は道長の権力が絶頂に達した時期でした。「この世をば…」で知られる道長の栄華の陰で、天皇自身の政治的実権は限られていました。"}, {"number": "第69代", "name": "後朱雀天皇", "kana": "ごすざくてんのう", "desc": "藤原頼通と協調しつつ、少しずつ皇室の権威を取り戻そうとした69代目天皇。病がちな中でも政治に向き合い、藤原氏を母方に持たない皇子へ皇位をつなぐ決断が、後の摂関政治衰退のきっかけとなりました。"}, {"number": "第70代", "name": "後冷泉天皇", "kana": "ごれいぜいてんのう", "desc": "23年にわたって在位した70代目天皇。皇子に恵まれず、藤原氏の外戚支配が揺らぐ要因となりました。東北では前九年の役が起こり、武士の力が不可欠になっていきます。平安の政治構造が崩れ始めた時代です。"}, {"number": "第71代", "name": "後三条天皇", "kana": "ごさんじょうてんのう", "desc": "藤原氏を外戚に持たない天皇として即位した71代目天皇。延久の荘園整理令を進め、摂関家や貴族の経済基盤に切り込みました。短い治世ながら天皇中心の政治を復活させ、後の院政への道を開いた改革者です。"}, {"number": "第72代", "name": "白河天皇", "kana": "しらかわてんのう", "desc": "退位後も上皇・法皇として長く実権を握り、院政を本格化させた72代目天皇。「賀茂川の水、双六の賽、山法師」は思い通りにならないと語った逸話で有名です。天皇退位後も権力を持つ新しい政治の形を作りました。"}, {"number": "第73代", "name": "堀河天皇", "kana": "ほりかわてんのう", "desc": "白河上皇の院政のもとで即位した73代目天皇。政治の実権は限られていましたが、音楽や和歌に優れ、その人格から賢王と慕われました。強大な父の影で、徳と文化によって朝廷の精神的中心を保った天皇です。"}, {"number": "第74代", "name": "鳥羽天皇", "kana": "とばてんのう", "desc": "白河上皇の死後、院政の最盛期を築いた74代目天皇。大きな経済力を持つ一方、皇位継承や后をめぐる対立が複雑化しました。崇徳天皇との確執などが後の保元の乱につながり、平安時代の終わりを早めることになります。"}, {"number": "第75代", "name": "崇徳天皇", "kana": "すとくてんのう", "desc": "父・鳥羽上皇との確執に苦しみ、保元の乱で敗れて讃岐へ流された75代目天皇。死後は強い怨霊になったという伝説が生まれました。優れた歌人でもあり、政治的敗北と文化的才能の両面を持つ悲劇の天皇です。"}, {"number": "第76代", "name": "近衛天皇", "kana": "このえてんのう", "desc": "わずか3歳で即位した76代目天皇。鳥羽上皇と美福門院の子として期待されましたが、病弱で若くして崩御しました。その死が後継者争いを再燃させ、保元の乱へつながる皇室内部の対立を深めました。"}, {"number": "第77代", "name": "後白河天皇", "kana": "ごしらかわてんのう", "desc": "保元・平治の乱、平清盛、源頼朝の台頭という激動期を生き抜いた77代目天皇。退位後は長く院政を行い、武士勢力を巧みに利用して朝廷の権威を守りました。今様を愛した文化人であり、強靱な政治家でもありました。"}, {"number": "第78代", "name": "二条天皇", "kana": "にじょうてんのう", "desc": "父・後白河上皇の院政に対抗し、天皇親政を目指した78代目天皇。平清盛らを用いながら、上皇の影響力を抑えようとしました。若くして病に倒れましたが、院政に抗って天皇自身の政治を取り戻そうとした人物です。"}, {"number": "第79代", "name": "六条天皇", "kana": "ろくじょうてんのう", "desc": "1歳前後で即位した、日本史上最年少の天皇とされる79代目天皇。政治は後白河上皇らによって進められ、本人が政務を担う余地はほとんどありませんでした。院政が極まり、天皇の地位が形式化した時代を象徴します。"}, {"number": "第80代", "name": "高倉天皇", "kana": "たかくらてんのう", "desc": "平清盛の娘・徳子を后に迎えた80代目天皇。父・後白河法皇と清盛の激しい対立の間に置かれ、繊細な性格ゆえに苦悩したと伝えられます。平氏全盛とその崩壊が近づく中、若くして崩御しました。"}, {"number": "第81代", "name": "安徳天皇", "kana": "あんとくてんのう", "desc": "平清盛の孫として幼くして即位した81代目天皇。源平合戦で平氏とともに西国へ逃れ、壇ノ浦の戦いで祖母・二位尼と海へ身を投じたと伝えられます。三種の神器とともに沈んだ悲劇の幼帝として知られます。"}, {"number": "第82代", "name": "後鳥羽天皇", "kana": "ごとばてんのう", "desc": "武家政権に正面から挑んだ82代目天皇。退位後、承久の乱を起こして鎌倉幕府打倒を試みましたが敗れ、隠岐へ流されました。和歌や刀剣にも優れ、『新古今和歌集』の成立を支えた文化人でもあります。"}, {"number": "第83代", "name": "土御門天皇", "kana": "つちみかどてんのう", "desc": "父・後鳥羽上皇の承久の乱に反対したとされる83代目天皇。乱には直接関与していませんでしたが、父が流されたことを悲しみ、自ら土佐へ移る道を選びました。権力より家族への情を重んじた穏やかな天皇として語られます。"}, {"number": "第84代", "name": "順徳天皇", "kana": "じゅんとくてんのう", "desc": "父・後鳥羽上皇とともに承久の乱へ深く関わった84代目天皇。退位して倒幕計画に加わりましたが、敗北後は佐渡へ流されました。流刑地でも宮廷儀式をまとめた『禁秘抄』を著し、皇室文化の継承に努めました。"}, {"number": "第85代", "name": "仲恭天皇", "kana": "ちゅうきょうてんのう", "desc": "承久の乱の最中に4歳で即位した85代目天皇。幕府側の勝利後、わずか数十日で廃位され、長く「九条廃帝」と呼ばれていました。大人たちの権力争いに巻き込まれた、きわめて短い治世の幼帝です。"}, {"number": "第86代", "name": "後堀河天皇", "kana": "ごほりかわてんのう", "desc": "承久の乱後、幕府の意向を受けて即位した86代目天皇。主要な皇族が流された後の混乱した朝廷を立て直し、幕府との距離を保ちながら皇室の存続に努めました。乱後の再建を担った天皇です。"}, {"number": "第87代", "name": "四条天皇", "kana": "しじょうてんのう", "desc": "幼くして即位し、12歳で急死した87代目天皇。宮中で人を驚かせようと滑る仕掛けをしたところ、自ら転倒して亡くなったという逸話で知られます。突然の死が再び皇位継承問題を引き起こしました。"}, {"number": "第88代", "name": "後嵯峨天皇", "kana": "ごさがてんのう", "desc": "幕府の支持を受けて即位した88代目天皇。退位後も院政を行いましたが、二人の皇子の系統を交互に皇位へ就ける形を残したことが、持明院統と大覚寺統の対立につながりました。後の南北朝分裂の遠因となります。"}, {"number": "第89代", "name": "後深草天皇", "kana": "ごふかくさてんのう", "desc": "後嵯峨天皇の皇子で、持明院統の祖となった89代目天皇。父の意向で弟へ皇位を譲ったことへの不満から、後に自らの系統の復権を目指しました。皇位をめぐる二つの系統の競争が本格化していきます。"}, {"number": "第90代", "name": "亀山天皇", "kana": "かめやまてんのう", "desc": "大覚寺統の祖となった90代目天皇。治世中に元寇という国家的危機が起こり、伊勢神宮などで国難克服を祈願しました。武士が戦う一方で、朝廷の精神的中心として祈りを捧げた天皇として知られます。"}, {"number": "第91代", "name": "後宇多天皇", "kana": "ごうだてんのう", "desc": "亀山天皇の子として即位した91代目天皇。持明院統と大覚寺統が交互に皇位を継ぐ両統迭立の時代を生きました。学問を奨励し、院政を通じて朝廷の機能回復に努め、後醍醐天皇の改革へつながる土台を作りました。"}, {"number": "第92代", "name": "伏見天皇", "kana": "ふしみてんのう", "desc": "持明院統の中心人物となった92代目天皇。和歌や書に優れ、伏見院流と呼ばれる文化を築きました。一方で浅原為頼による襲撃事件など、皇位をめぐる緊張にも直面し、文化と政争が隣り合う時代を生きました。"}, {"number": "第93代", "name": "後伏見天皇", "kana": "ごふしみてんのう", "desc": "持明院統の93代目天皇。幼くして即位し、両統迭立の取り決めの中で短期間で退位しました。その後は上皇として自らの系統を支え、皇位継承をめぐる持明院統と大覚寺統の競争を生き抜きました。"}, {"number": "第94代", "name": "後二条天皇", "kana": "ごにじょうてんのう", "desc": "大覚寺統から即位した94代目天皇。持明院統との皇位継承競争の中、若くして皇位に就きました。治世は短く、早世したことで再び皇位継承の調整が必要となり、二つの皇統の緊張はさらに続くことになります。"}, {"number": "第95代", "name": "花園天皇", "kana": "はなぞのてんのう", "desc": "学問と精神修養を重んじた95代目天皇。持明院統の天皇として即位し、後に禅や儒学を深く学びました。次代の天皇に対して君主の心得を説くなど、政治の実権よりも理想の君主像を追求した知的な天皇です。"}, {"number": "第96代", "name": "後醍醐天皇", "kana": "ごだいごてんのう", "desc": "鎌倉幕府を倒し、天皇親政を復活させようとした96代目天皇。建武の新政を始めましたが、足利尊氏らとの対立から吉野へ移り、南朝を開きました。理想を貫き、日本を南北朝の時代へ導いた強烈な個性の天皇です。"}, {"number": "第97代", "name": "後村上天皇", "kana": "ごむらかみてんのう", "desc": "後醍醐天皇の志を継ぎ、南朝を支えた97代目天皇。京都奪還を目指して各地を転戦し、住吉や観心寺などを拠点に戦い続けました。厳しい状況でも家臣との結束を保ち、南朝の正統性を守り抜いた天皇です。"}, {"number": "第98代", "name": "長慶天皇", "kana": "ちょうけいてんのう", "desc": "南北朝の争いが続く中で即位した98代目天皇。記録が少なく、長く歴代天皇に数えられなかった時期もあります。南朝の勢力が弱まる中でも抗戦の姿勢を保ち、失われつつある南朝の権威をつなぎました。"}, {"number": "第99代", "name": "後亀山天皇", "kana": "ごかめやまてんのう", "desc": "南朝最後の天皇となった99代目天皇。長く続いた南北朝の争いを終わらせるため、足利義満の提案を受け入れ、三種の神器を京都へ返還しました。皇位への執着より平和を優先し、南北朝統一を実現した天皇です。"}, {"number": "第100代", "name": "後小松天皇", "kana": "ごこまつてんのう", "desc": "南北朝統一後の100代目天皇。北朝の系統から続き、足利義満の強い影響力のもとで朝廷を支えました。統一後の皇室秩序を安定させる役割を担い、室町時代の新しい政治体制の中で皇統をつなぎました。"}, {"number": "第101代", "name": "称光天皇", "kana": "しょうこうてんのう", "desc": "後小松天皇の後を継いだ101代目天皇。病弱で皇子にも恵まれず、皇位継承が再び不安定になりました。室町幕府の影響力が強い時代の中、皇室の存続を守ることが大きな課題となった天皇です。"}, {"number": "第102代", "name": "後花園天皇", "kana": "ごはなぞのてんのう", "desc": "伏見宮家から迎えられて即位した102代目天皇。応仁の乱へ向かう混乱の時代に、朝廷の権威を保とうと努めました。将軍・足利義政にも意見を述べるなど、政治的な自覚を持ち、文化と秩序の維持に尽力した天皇です。"}, {"number": "第103代", "name": "後土御門天皇", "kana": "ごつちみかどてんのう", "desc": "応仁の乱の混乱の中で即位した103代目天皇。京都が荒廃し、朝廷の財政も極端に苦しくなる中で皇室を守りました。戦国時代へ向かう厳しい状況でも、儀式や文化を絶やさず皇統をつないだ天皇です。"}, {"number": "第104代", "name": "後柏原天皇", "kana": "ごかしわばらてんのう", "desc": "戦国時代の真っただ中で即位した104代目天皇。財政難のため即位式を長く行えず、朝廷の権威が大きく低下していた時代でした。それでも諸国の大名や寺社との関係を保ち、皇室の伝統を守り続けました。"}, {"number": "第105代", "name": "後奈良天皇", "kana": "ごならてんのう", "desc": "戦国の混乱と財政難の中で即位した105代目天皇。各地の大名へ書を送り、皇室への支援を求めながら朝廷を維持しました。飢饉や疫病に苦しむ民のため般若心経を書写したとも伝えられ、祈りを重んじた天皇です。"}, {"number": "第106代", "name": "正親町天皇", "kana": "おおぎまちてんのう", "desc": "織田信長が台頭した戦国末期に在位した106代目天皇。朝廷の財政は苦しかったものの、信長ら有力武将との関係を築きながら皇室の権威回復を進めました。戦国から統一政権へ向かう転換期を見届けた天皇です。"}, {"number": "第107代", "name": "後陽成天皇", "kana": "ごようぜいてんのう", "desc": "豊臣秀吉と徳川家康の時代を生きた107代目天皇。聚楽第行幸などを通じて秀吉の権威を認める一方、徳川政権成立後には新しい幕府との関係を築きました。出版文化にも関わり、近世皇室の基礎を整えた天皇です。"}, {"number": "第108代", "name": "後水尾天皇", "kana": "ごみずのおてんのう", "desc": "江戸幕府の強い統制に立ち向かった108代目天皇。禁中並公家諸法度や紫衣事件をめぐって幕府と対立し、突然の退位で意思を示しました。退位後は修学院離宮を造営し、文化を通じて皇室の存在感を示しました。"}, {"number": "第109代", "name": "明正天皇", "kana": "めいしょうてんのう", "desc": "後水尾天皇と徳川和子の娘として即位した109代目の女性天皇。奈良時代以来およそ860年ぶりの女性天皇でした。父の院政と江戸幕府の間で、皇室と幕府の結びつきを象徴する存在となりました。"}, {"number": "第110代", "name": "後光明天皇", "kana": "ごこうみょうてんのう", "desc": "学問と武芸を好んだ110代目天皇。儒学や神道を重んじ、幕府に依存しすぎない皇室のあり方を模索したとされます。若くして疱瘡で崩御しましたが、強い意志と知性を持つ改革志向の天皇として語られます。"}, {"number": "第111代", "name": "後西天皇", "kana": "ごさいてんのう", "desc": "明暦の大火など災害が相次ぐ時代に即位した111代目天皇。政治的な実権は限られていましたが、和歌や学問に力を注ぎ、宮廷文化を守りました。混乱の時代に文化の継承を通じて皇室の存在を支えた天皇です。"}, {"number": "第112代", "name": "霊元天皇", "kana": "れいげんてんのう", "desc": "江戸幕府の影響が強い中で皇室の権威回復を目指した112代目天皇。古い宮中儀式の復興を進め、天皇を中心とする伝統秩序を再構築しようとしました。退位後も上皇として長く影響力を持ちました。"}, {"number": "第113代", "name": "東山天皇", "kana": "ひがしやまてんのう", "desc": "徳川綱吉の時代に在位した113代目天皇。幕府との協調を保ちながら、皇室の財政や儀式の立て直しを進めました。新しい宮家である閑院宮の創設にもつながり、皇位継承の安定に貢献した天皇です。"}, {"number": "第114代", "name": "中御門天皇", "kana": "なかみかどてんのう", "desc": "徳川吉宗の時代に在位した114代目天皇。幕府との関係を大きく乱すことなく、宮廷文化と伝統儀礼を守りました。政治的には穏やかな時期でしたが、朝廷と幕府が共存する江戸時代の安定を象徴する天皇です。"}, {"number": "第115代", "name": "桜町天皇", "kana": "さくらまちてんのう", "desc": "聖徳太子の再来とも仰がれた115代目天皇。途絶えていた大嘗祭や新嘗祭など古い宮中儀式を復興し、天皇の役割を祭祀の面から立て直しました。江戸時代に皇室の伝統をよみがえらせた重要な天皇です。"}, {"number": "第116代", "name": "桃園天皇", "kana": "ももぞのてんのう", "desc": "学問への情熱を持った116代目天皇。垂加神道など尊王思想に関心を寄せ、側近たちと学びましたが、それが幕府との緊張を生み、宝暦事件へ発展しました。若い天皇の理想と幕府の統制が衝突した時代です。"}, {"number": "第117代", "name": "後桜町天皇", "kana": "ごさくらまちてんのう", "desc": "日本史上最後の女性天皇となった117代目天皇。幼い後継者へ皇位をつなぐ役割を担い、退位後も皇室を長く支えました。和歌や古典に親しみ、飢饉などの際には民の安寧を祈った慈愛深い天皇として知られます。"}, {"number": "第118代", "name": "後桃園天皇", "kana": "ごももぞのてんのう", "desc": "後桜町天皇の後を継いだ118代目天皇。若くして即位しましたが、男子の後継者を残さず崩御したため、皇位継承が大きな問題となりました。ここから別系統の閑院宮家から光格天皇が迎えられることになります。"}, {"number": "第119代", "name": "光格天皇", "kana": "こうかくてんのう", "desc": "閑院宮家から迎えられて即位した119代目天皇。皇室儀礼の復興と権威回復に強い意欲を示し、父へ太上天皇号を贈ろうとした尊号一件で幕府と対立しました。近代へ向かう皇室再興の流れを強めた天皇です。"}, {"number": "第120代", "name": "仁孝天皇", "kana": "にんこうてんのう", "desc": "学問を重視した120代目天皇。皇族や公家の教育を充実させるため学習所を設け、後の学習院につながる動きを作りました。幕末前夜の不安定な時代に、教育と文化を通じて皇室の基盤を整えた天皇です。"}, {"number": "第121代", "name": "孝明天皇", "kana": "こうめいてんのう", "desc": "ペリー来航と開国問題に直面した121代目天皇。外国との条約締結に強く慎重な姿勢を示し、攘夷を求める勢力の精神的中心となりました。幕府との対立が深まる中、明治維新直前の激動を生きた天皇です。"}, {"number": "第122代", "name": "明治天皇", "kana": "めいじてんのう", "desc": "明治維新と近代国家建設の時代を歩んだ122代目天皇。江戸から東京への遷都、廃藩置県、憲法制定など、日本が近代国家へ変貌する大改革の象徴となりました。急速な西洋化と国家統合の中心に置かれた天皇です。"}, {"number": "第123代", "name": "大正天皇", "kana": "たいしょうてんのう", "desc": "明治天皇の後を継いだ123代目天皇。健康上の問題から政治への関与は限られましたが、その時代には大正デモクラシーが広がり、政党政治や普通選挙を求める動きが活発になりました。近代日本の転換期を象徴する天皇です。"}, {"number": "第124代", "name": "昭和天皇", "kana": "しょうわてんのう", "desc": "昭和という長い時代を歩んだ124代目天皇。戦争と敗戦、戦後復興、高度経済成長まで、日本の激変を経験しました。戦後は日本国憲法のもとで象徴天皇として歩み、各地への訪問を通じ国民との距離を縮めました。"}, {"number": "第125代", "name": "明仁天皇", "kana": "あきひとてんのう", "desc": "戦後の象徴天皇制の中で即位した125代目天皇。国内外の戦没者慰霊や被災地訪問を重ね、国民に寄り添う姿勢を示しました。高齢を理由に生前退位の意向を示し、2019年に退位して上皇となりました。"}, {"number": "第126代", "name": "今上天皇", "kana": "きんじょうてんのう", "desc": "令和の時代を担う126代目天皇。国民に寄り添う象徴としての役割を受け継ぎながら、国内外で公務を行っています。歴代天皇の長い歴史の最前線に立ち、現代社会の中で皇室のあり方を示し続けています。"}];
const total = emperors.length;
let current = Number(localStorage.getItem('rekidai-tenno-current-v3')) || 0;
if (current < 0 || current >= total) current = 0;

const main = document.getElementById('main');
const numberEl = document.getElementById('number');
const nameEl = document.getElementById('name');
const kanaEl = document.getElementById('kana');
const descriptionEl = document.getElementById('description');
const counterEl = document.getElementById('counter');
const barEl = document.getElementById('bar');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');

function render() {
  const e = emperors[current];
  numberEl.textContent = e.number;
  nameEl.textContent = e.name;
  kanaEl.textContent = e.kana;
  descriptionEl.textContent = e.desc;
  counterEl.textContent = `${current + 1} / ${total}`;
  barEl.style.width = `${((current + 1) / total) * 100}%`;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === total - 1;
  main.scrollTop = 0;
  localStorage.setItem('rekidai-tenno-current-v3', current);
}
function goPrev() { if (current > 0) { current--; render(); } }
function goNext() { if (current < total - 1) { current++; render(); } }

prevBtn.addEventListener('click', goPrev);
nextBtn.addEventListener('click', goNext);

[prevBtn, nextBtn].forEach(btn => {
  btn.addEventListener('contextmenu', e => e.preventDefault());
  btn.addEventListener('selectstart', e => e.preventDefault());
  btn.addEventListener('dragstart', e => e.preventDefault());
  btn.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') e.currentTarget.setPointerCapture?.(e.pointerId);
  });
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') goPrev();
  if (e.key === 'ArrowRight') goNext();
});

render();
</script>
