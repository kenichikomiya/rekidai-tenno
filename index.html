<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="description" content="神武天皇から第126代まで、歴代天皇を順番に覚えるための暗記アプリ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>歴代天皇126</title>
</head>
<body>
  <main class="app">
    <section id="homeScreen" class="screen active" aria-labelledby="appTitle">
      <div class="home-card">
        <p class="eyebrow">歴代天皇暗記</p>
        <h1 id="appTitle">歴代天皇126</h1>
        <p class="lead">神武天皇から順番に、一代ずつ覚えます。</p>
        <button id="startButton" class="primary-button" type="button">神武天皇から始める</button>
        <button id="continueButton" class="secondary-button hidden" type="button">続きから</button>
      </div>
    </section>

    <section id="viewerScreen" class="screen" aria-live="polite">
      <header class="viewer-header">
        <button id="homeButton" class="text-button" type="button">ホーム</button>
        <div id="progressText" class="progress-text">1 / 126</div>
      </header>

      <div class="progress-track" aria-hidden="true">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <article class="emperor-card">
        <p id="numberText" class="number-text">第1代</p>
        <h2 id="nameText" class="name-text">神武天皇</h2>
        <p id="readingText" class="reading-text">じんむてんのう</p>
      </article>

      <nav class="navigation" aria-label="天皇を順番に表示">
        <button id="nextButton" class="nav-button next-button" type="button">次へ</button>
        <button id="prevButton" class="nav-button prev-button" type="button">前へ</button>
      </nav>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
